<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brick Drop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-brick">
  <div class="game">
    <div class="hud">
      <h1>Brick</h1>
      <div class="brick-hud-side">
        <div class="score-box">
          <div class="score-label">Score</div>
          <div id="score" class="score-value">0</div>
        </div>
        <div class="next-box">
          <div class="score-label">Next</div>
          <div id="next-piece" class="next-piece" aria-label="Next piece"></div>
        </div>
      </div>
    </div>

    <div class="board-wrap">
      <div id="board" class="board" aria-label="10 by 15 brick board"></div>
      <div id="overlay" class="overlay" aria-live="assertive">
        <h2 id="overlay-title">Game Over</h2>
        <p id="overlay-text">Press restart to try again.</p>
      </div>
    </div>

    <div class="controls">
      <div class="move-controls" aria-label="Brick controls">
        <button id="move-left" class="control-button" type="button" aria-label="Move left">←</button>
        <button id="rotate" class="control-button rotate-button" type="button" aria-label="Rotate piece">↻</button>
        <button id="move-right" class="control-button" type="button" aria-label="Move right">→</button>
      </div>
      <div class="game-actions">
        <div class="instructions">← → move • ↑ rotate • ↓ drop</div>
        <button id="restart" type="button">Restart</button>
      </div>
    </div>
  </div>

  <script>
    const GRID_COLUMNS = 10;
    const GRID_ROWS = 15;
    const DROP_INTERVAL = 550;
    const SHAPES = [
      { cells: [[1, 1, 1]], color: 'A' },
      { cells: [[1, 1, 1], [0, 1, 0]], color: 'B' },
      { cells: [[1, 1], [1, 1]], color: 'C' },
      { cells: [[1, 1, 1, 1]], color: 'D' },
      { cells: [[1, 1, 0], [0, 1, 1]], color: 'E' }
    ];

    const boardEl = document.getElementById('board');
    const nextPieceEl = document.getElementById('next-piece');
    const scoreEl = document.getElementById('score');
    const overlayEl = document.getElementById('overlay');
    const overlayTitleEl = document.getElementById('overlay-title');
    const overlayTextEl = document.getElementById('overlay-text');
    const restartBtn = document.getElementById('restart');
    const moveLeftBtn = document.getElementById('move-left');
    const moveRightBtn = document.getElementById('move-right');
    const rotateBtn = document.getElementById('rotate');

    let board = [];
    let currentPiece = null;
    let nextPieceTemplate = null;
    let score = 0;
    let lastDrop = 0;
    let gameOver = false;

    function createBoard() {
      return Array.from({ length: GRID_ROWS }, () => Array(GRID_COLUMNS).fill(0));
    }

    function randomTemplate() {
      return SHAPES[Math.floor(Math.random() * SHAPES.length)];
    }

    function createPiece(template) {
      const shape = template.cells.map((row) => [...row]);
      return {
        shape,
        row: 0,
        col: Math.floor((GRID_COLUMNS - shape[0].length) / 2),
        color: template.color
      };
    }

    function renderNextPiece() {
      nextPieceEl.replaceChildren();
      nextPieceEl.style.setProperty('--preview-columns', String(nextPieceTemplate.cells[0].length));
      nextPieceTemplate.cells.forEach((row) => {
        row.forEach((filled) => {
          const cell = document.createElement('span');
          cell.className = filled ? 'next-cell next-cell-filled' : 'next-cell';
          nextPieceEl.appendChild(cell);
        });
      });
    }

    function spawnNextPiece() {
      currentPiece = createPiece(nextPieceTemplate);
      nextPieceTemplate = randomTemplate();
      renderNextPiece();
      if (!canPlace(currentPiece, currentPiece.row, currentPiece.col)) {
        endGame();
      }
    }

    function updateScore() {
      scoreEl.textContent = String(score);
    }

    function canPlace(piece, nextRow, nextCol, nextShape = piece.shape) {
      for (let r = 0; r < nextShape.length; r += 1) {
        for (let c = 0; c < nextShape[r].length; c += 1) {
          if (!nextShape[r][c]) continue;

          const cellRow = nextRow + r;
          const cellCol = nextCol + c;

          if (cellCol < 0 || cellCol >= GRID_COLUMNS || cellRow >= GRID_ROWS) {
            return false;
          }

          if (cellRow >= 0 && board[cellRow][cellCol]) {
            return false;
          }
        }
      }
      return true;
    }

    function rotateMatrix(matrix) {
      const rows = matrix.length;
      const cols = matrix[0].length;
      const newMatrix = Array.from({ length: cols }, () => Array(rows).fill(0));

      for (let r = 0; r < rows; r += 1) {
        for (let c = 0; c < cols; c += 1) {
          newMatrix[c][rows - 1 - r] = matrix[r][c];
        }
      }

      return newMatrix;
    }

    function mergePiece() {
      for (let r = 0; r < currentPiece.shape.length; r += 1) {
        for (let c = 0; c < currentPiece.shape[r].length; c += 1) {
          if (!currentPiece.shape[r][c]) continue;
          const row = currentPiece.row + r;
          const col = currentPiece.col + c;
          if (row >= 0) board[row][col] = 1;
        }
      }

      clearLines();
      spawnNextPiece();
    }

    function clearLines() {
      let cleared = 0;

      for (let r = GRID_ROWS - 1; r >= 0; r -= 1) {
        if (board[r].every((cell) => cell === 1)) {
          board.splice(r, 1);
          board.unshift(Array(GRID_COLUMNS).fill(0));
          cleared += 1;
          r += 1;
        }
      }

      if (cleared > 0) {
        score += cleared * 10;
        updateScore();
      }
    }

    function endGame() {
      gameOver = true;
      overlayTitleEl.textContent = 'Game Over';
      overlayTextEl.textContent = 'Press restart to try again.';
      overlayEl.classList.add('visible');
    }

    function render() {
      const cells = [];

      for (let r = 0; r < GRID_ROWS; r += 1) {
        for (let c = 0; c < GRID_COLUMNS; c += 1) {
          const cell = document.createElement('div');
          cell.className = 'cell';

          if (board[r][c]) {
            cell.classList.add('filled');
          }

          if (currentPiece) {
            const localRow = r - currentPiece.row;
            const localCol = c - currentPiece.col;

            if (
              localRow >= 0 &&
              localRow < currentPiece.shape.length &&
              localCol >= 0 &&
              localCol < currentPiece.shape[localRow].length &&
              currentPiece.shape[localRow][localCol]
            ) {
              cell.classList.add('active');
            }
          }

          cells.push(cell);
        }
      }

      boardEl.innerHTML = '';
      cells.forEach((cell) => boardEl.appendChild(cell));
    }

    function movePiece(dx) {
      if (gameOver || !currentPiece) return;
      const nextCol = currentPiece.col + dx;
      if (canPlace(currentPiece, currentPiece.row, nextCol)) {
        currentPiece.col = nextCol;
        render();
      }
    }

    function rotatePiece() {
      if (gameOver || !currentPiece) return;
      const rotated = rotateMatrix(currentPiece.shape);
      const candidate = { ...currentPiece, shape: rotated };
      const kickOffsets = [0, -1, 1, -2, 2];

      for (const offset of kickOffsets) {
        if (canPlace(candidate, candidate.row, candidate.col + offset, rotated)) {
          currentPiece = { ...candidate, col: candidate.col + offset };
          render();
          return;
        }
      }
    }

    function tickDown() {
      if (gameOver || !currentPiece) return;

      const nextRow = currentPiece.row + 1;
      if (canPlace(currentPiece, nextRow, currentPiece.col)) {
        currentPiece.row = nextRow;
      } else {
        mergePiece();
      }

      render();
    }

    function dropPiece() {
      if (gameOver || !currentPiece) return;
      while (canPlace(currentPiece, currentPiece.row + 1, currentPiece.col)) {
        currentPiece.row += 1;
      }
      mergePiece();
      render();
    }

    function resetGame() {
      board = createBoard();
      score = 0;
      updateScore();
      gameOver = false;
      overlayEl.classList.remove('visible');
      nextPieceTemplate = randomTemplate();
      spawnNextPiece();
      lastDrop = 0;
      render();
    }

    function gameLoop(timestamp) {
      if (!lastDrop) lastDrop = timestamp;
      if (timestamp - lastDrop >= DROP_INTERVAL) {
        tickDown();
        lastDrop = timestamp;
      }
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') movePiece(-1);
      if (event.key === 'ArrowRight') movePiece(1);
      if (event.key === 'ArrowUp') rotatePiece();
      if (event.key === 'ArrowDown') dropPiece();
      if (event.code === 'Space') {
        event.preventDefault();
        dropPiece();
      }
    });

    restartBtn.addEventListener('click', resetGame);
    moveLeftBtn.addEventListener('click', () => movePiece(-1));
    moveRightBtn.addEventListener('click', () => movePiece(1));
    rotateBtn.addEventListener('click', rotatePiece);

    resetGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
