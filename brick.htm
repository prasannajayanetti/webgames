<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brick Drop</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --grid-bg: #1f2937;
      --cell: #374151;
      --filled: #60a5fa;
      --filled-2: #fbbf24;
      --text: #e5e7eb;
      --muted: #9ca3af;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #020817, #111827);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .game {
      width: min(92vw, 420px);
    }

    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 2.8rem);
    }

    .score-box {
      background: var(--panel);
      border-radius: 12px;
      padding: 8px 12px;
      min-width: 90px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }

    .score-label {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .score-value {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .board-wrap {
      position: relative;
      background: var(--panel);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 14px 28px rgba(0,0,0,0.2);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 4px;
      background: var(--grid-bg);
      border-radius: 10px;
      padding: 4px;
    }

    .cell {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 5px;
      background: var(--cell);
      transition: transform 0.08s ease, background 0.08s ease;
    }

    .cell.filled {
      background: var(--filled);
    }

    .cell.active {
      background: var(--filled-2);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      gap: 12px;
    }

    .instructions {
      color: var(--muted);
      font-size: 0.9rem;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: #2563eb;
      color: white;
      font-weight: 700;
    }

    .overlay {
      position: absolute;
      inset: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.82);
      text-align: center;
    }

    .overlay.visible {
      display: flex;
    }

    .overlay h2 {
      margin: 0;
      font-size: 2rem;
    }

    .overlay p {
      margin: 0;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="hud">
      <h1>Brick</h1>
      <div class="score-box">
        <div class="score-label">Score</div>
        <div id="score" class="score-value">0</div>
      </div>
    </div>

    <div class="board-wrap">
      <div id="board" class="board" aria-label="10 by 10 brick board"></div>
      <div id="overlay" class="overlay" aria-live="assertive">
        <h2 id="overlay-title">Game Over</h2>
        <p id="overlay-text">Press restart to try again.</p>
      </div>
    </div>

    <div class="controls">
      <div class="instructions">← → move • ↑ rotate • ↓ drop</div>
      <button id="restart" type="button">Restart</button>
    </div>
  </div>

  <script>
    const GRID_SIZE = 10;
    const DROP_INTERVAL = 550;
    const SHAPES = [
      { cells: [[1, 1, 1]], color: 'A' },
      { cells: [[1, 1, 1], [0, 1, 0]], color: 'B' },
      { cells: [[1, 1], [1, 1]], color: 'C' },
      { cells: [[1, 1, 1, 1]], color: 'D' },
      { cells: [[1, 1, 0], [0, 1, 1]], color: 'E' }
    ];

    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const overlayEl = document.getElementById('overlay');
    const overlayTitleEl = document.getElementById('overlay-title');
    const overlayTextEl = document.getElementById('overlay-text');
    const restartBtn = document.getElementById('restart');

    let board = [];
    let currentPiece = null;
    let score = 0;
    let lastDrop = 0;
    let gameOver = false;

    function createBoard() {
      return Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0));
    }

    function randomPiece() {
      const template = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      const shape = template.cells.map((row) => [...row]);
      return {
        shape,
        row: 0,
        col: Math.floor((GRID_SIZE - shape[0].length) / 2),
        color: template.color
      };
    }

    function updateScore() {
      scoreEl.textContent = String(score);
    }

    function canPlace(piece, nextRow, nextCol, nextShape = piece.shape) {
      for (let r = 0; r < nextShape.length; r += 1) {
        for (let c = 0; c < nextShape[r].length; c += 1) {
          if (!nextShape[r][c]) continue;

          const cellRow = nextRow + r;
          const cellCol = nextCol + c;

          if (cellCol < 0 || cellCol >= GRID_SIZE || cellRow >= GRID_SIZE) {
            return false;
          }

          if (cellRow >= 0 && board[cellRow][cellCol]) {
            return false;
          }
        }
      }
      return true;
    }

    function rotateMatrix(matrix) {
      const rows = matrix.length;
      const cols = matrix[0].length;
      const newMatrix = Array.from({ length: cols }, () => Array(rows).fill(0));

      for (let r = 0; r < rows; r += 1) {
        for (let c = 0; c < cols; c += 1) {
          newMatrix[c][rows - 1 - r] = matrix[r][c];
        }
      }

      return newMatrix;
    }

    function mergePiece() {
      for (let r = 0; r < currentPiece.shape.length; r += 1) {
        for (let c = 0; c < currentPiece.shape[r].length; c += 1) {
          if (!currentPiece.shape[r][c]) continue;
          const row = currentPiece.row + r;
          const col = currentPiece.col + c;
          if (row >= 0) board[row][col] = 1;
        }
      }

      clearLines();
      currentPiece = randomPiece();

      if (!canPlace(currentPiece, currentPiece.row, currentPiece.col)) {
        endGame();
      }
    }

    function clearLines() {
      let cleared = 0;

      for (let r = GRID_SIZE - 1; r >= 0; r -= 1) {
        if (board[r].every((cell) => cell === 1)) {
          board.splice(r, 1);
          board.unshift(Array(GRID_SIZE).fill(0));
          cleared += 1;
          r += 1;
        }
      }

      if (cleared > 0) {
        score += cleared * 10;
        updateScore();
      }
    }

    function endGame() {
      gameOver = true;
      overlayTitleEl.textContent = 'Game Over';
      overlayTextEl.textContent = 'Press restart to try again.';
      overlayEl.classList.add('visible');
    }

    function render() {
      const cells = [];

      for (let r = 0; r < GRID_SIZE; r += 1) {
        for (let c = 0; c < GRID_SIZE; c += 1) {
          const cell = document.createElement('div');
          cell.className = 'cell';

          if (board[r][c]) {
            cell.classList.add('filled');
          }

          if (currentPiece) {
            const localRow = r - currentPiece.row;
            const localCol = c - currentPiece.col;

            if (
              localRow >= 0 &&
              localRow < currentPiece.shape.length &&
              localCol >= 0 &&
              localCol < currentPiece.shape[localRow].length &&
              currentPiece.shape[localRow][localCol]
            ) {
              cell.classList.add('active');
            }
          }

          cells.push(cell);
        }
      }

      boardEl.innerHTML = '';
      cells.forEach((cell) => boardEl.appendChild(cell));
    }

    function movePiece(dx) {
      if (gameOver || !currentPiece) return;
      const nextCol = currentPiece.col + dx;
      if (canPlace(currentPiece, currentPiece.row, nextCol)) {
        currentPiece.col = nextCol;
        render();
      }
    }

    function rotatePiece() {
      if (gameOver || !currentPiece) return;
      const rotated = rotateMatrix(currentPiece.shape);
      const candidate = { ...currentPiece, shape: rotated };
      const kickOffsets = [0, -1, 1, -2, 2];

      for (const offset of kickOffsets) {
        if (canPlace(candidate, candidate.row, candidate.col + offset, rotated)) {
          currentPiece = { ...candidate, col: candidate.col + offset };
          render();
          return;
        }
      }
    }

    function tickDown() {
      if (gameOver || !currentPiece) return;

      const nextRow = currentPiece.row + 1;
      if (canPlace(currentPiece, nextRow, currentPiece.col)) {
        currentPiece.row = nextRow;
      } else {
        mergePiece();
      }

      render();
    }

    function dropPiece() {
      if (gameOver || !currentPiece) return;
      while (canPlace(currentPiece, currentPiece.row + 1, currentPiece.col)) {
        currentPiece.row += 1;
      }
      mergePiece();
      render();
    }

    function resetGame() {
      board = createBoard();
      score = 0;
      updateScore();
      currentPiece = randomPiece();
      gameOver = false;
      overlayEl.classList.remove('visible');
      render();
    }

    function gameLoop(timestamp) {
      if (!lastDrop) lastDrop = timestamp;
      if (timestamp - lastDrop >= DROP_INTERVAL) {
        tickDown();
        lastDrop = timestamp;
      }
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') movePiece(-1);
      if (event.key === 'ArrowRight') movePiece(1);
      if (event.key === 'ArrowUp') rotatePiece();
      if (event.key === 'ArrowDown') dropPiece();
      if (event.code === 'Space') {
        event.preventDefault();
        dropPiece();
      }
    });

    restartBtn.addEventListener('click', resetGame);

    resetGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
