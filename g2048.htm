<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048</title>
    <style>
      :root {
        --bg: #faf8ef;
        --panel: #bbada0;
        --cell-empty: #cdc1b4;
        --text: #776e65;
        --text-light: #f9f6f2;
        --tile-2: #eee4da;
        --tile-4: #ede0c8;
        --tile-8: #f2b179;
        --tile-16: #f59563;
        --tile-32: #f67c5f;
        --tile-64: #f65e3b;
        --tile-128: #edcf72;
        --tile-256: #edcc61;
        --tile-512: #edc850;
        --tile-1024: #edc53f;
        --tile-2048: #edc22e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .game {
        width: min(90vw, 500px);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.8rem, 7vw, 4.4rem);
        line-height: 1;
        color: var(--text);
      }

      .scores {
        display: flex;
        gap: 10px;
      }

      .score-box {
        min-width: 110px;
        background: var(--panel);
        color: var(--text-light);
        padding: 10px 14px;
        border-radius: 8px;
        text-align: center;
      }

      .score-label {
        font-size: 0.7rem;
        opacity: 0.9;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .score-value {
        font-size: 1.5rem;
        font-weight: 700;
        margin-top: 4px;
      }

      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }

      .instructions {
        font-size: 0.95rem;
        font-weight: 700;
      }

      button {
        border: 0;
        border-radius: 8px;
        background: #8f7a66;
        color: var(--text-light);
        font-size: 1rem;
        font-weight: 700;
        padding: 11px 18px;
        cursor: pointer;
        transition: transform 0.12s ease, filter 0.12s ease;
      }

      button:hover {
        filter: brightness(1.05);
      }

      button:active {
        transform: translateY(1px);
      }

      .board-wrapper {
        position: relative;
        background: var(--panel);
        border-radius: 12px;
        padding: 12px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
      }

      .board {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        background: var(--panel);
        border-radius: 10px;
      }

      .cell {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        background: var(--cell-empty);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: clamp(1.25rem, 3.5vw, 2.2rem);
        user-select: none;
        transition: all 0.12s ease;
        animation: tile-pop 0.18s ease;
      }

      .cell[data-value='0'] {
        color: transparent;
      }

      @keyframes tile-pop {
        0% {
          transform: scale(0.7);
          opacity: 0;
        }
        75% {
          transform: scale(1.08);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      .cell[data-value='2'] { background: var(--tile-2); }
      .cell[data-value='4'] { background: var(--tile-4); }
      .cell[data-value='8'] { background: var(--tile-8); color: var(--text-light); }
      .cell[data-value='16'] { background: var(--tile-16); color: var(--text-light); }
      .cell[data-value='32'] { background: var(--tile-32); color: var(--text-light); }
      .cell[data-value='64'] { background: var(--tile-64); color: var(--text-light); }
      .cell[data-value='128'] { background: var(--tile-128); color: var(--text-light); font-size: clamp(1.1rem, 3vw, 1.8rem); }
      .cell[data-value='256'] { background: var(--tile-256); color: var(--text-light); font-size: clamp(1.1rem, 3vw, 1.8rem); }
      .cell[data-value='512'] { background: var(--tile-512); color: var(--text-light); font-size: clamp(1.1rem, 3vw, 1.8rem); }
      .cell[data-value='1024'] { background: var(--tile-1024); color: var(--text-light); font-size: clamp(0.9rem, 2.5vw, 1.65rem); }
      .cell[data-value='2048'] { background: var(--tile-2048); color: var(--text-light); font-size: clamp(0.9rem, 2.5vw, 1.65rem); }
      .cell[data-value='4096'],
      .cell[data-value='8192'],
      .cell[data-value='16384'],
      .cell[data-value='32768'] {
        background: #3c3a32;
        color: var(--text-light);
        font-size: clamp(0.8rem, 2.2vw, 1.4rem);
      }

      .overlay {
        position: absolute;
        inset: 12px;
        border-radius: 10px;
        background: rgba(238, 228, 218, 0.8);
        display: none;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        flex-direction: column;
        gap: 16px;
      }

      .overlay.visible {
        display: flex;
      }

      .overlay h2 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      .overlay p {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 700;
      }

      @media (max-width: 500px) {
        .topbar {
          align-items: flex-start;
        }

        .scores {
          gap: 8px;
        }

        .score-box {
          min-width: 92px;
          padding: 10px 8px;
        }

        .controls {
          gap: 10px;
          align-items: center;
        }

        .instructions {
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="game" aria-label="2048 game board">
      <div class="topbar">
        <h1>2048</h1>
        <div class="scores">
          <div class="score-box">
            <div class="score-label">Score</div>
            <div id="score" class="score-value">0</div>
          </div>
          <div class="score-box">
            <div class="score-label">Best</div>
            <div id="best" class="score-value">0</div>
          </div>
        </div>
      </div>

      <div class="controls">
        <div class="instructions">Join the numbers and get to the 2048 tile!</div>
        <button id="new-game" type="button">New Game</button>
      </div>

      <div class="board-wrapper">
        <div id="board" class="board" aria-live="polite" aria-label="Game grid"></div>
        <div id="overlay" class="overlay" aria-live="assertive">
          <h2 id="overlay-title">You win!</h2>
          <p id="overlay-text">Tap to keep playing</p>
        </div>
      </div>
    </div>

    <script>
      const BOARD_SIZE = 4;
      let board = [];
      let score = 0;
      let best = Number(localStorage.getItem('g2048-best') || 0);
      let won = false;
      let gameOver = false;

      const boardEl = document.getElementById('board');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const overlayEl = document.getElementById('overlay');
      const overlayTitleEl = document.getElementById('overlay-title');
      const overlayTextEl = document.getElementById('overlay-text');
      const newGameBtn = document.getElementById('new-game');

      function createEmptyBoard() {
        return Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
      }

      function updateScoreDisplay() {
        scoreEl.textContent = String(score);
        bestEl.textContent = String(best);
      }

      function renderBoard() {
        boardEl.innerHTML = '';

        for (let row = 0; row < BOARD_SIZE; row += 1) {
          for (let col = 0; col < BOARD_SIZE; col += 1) {
            const cell = document.createElement('div');
            const value = board[row][col];
            cell.className = 'cell';
            cell.dataset.value = String(value);
            cell.textContent = value === 0 ? '' : String(value);
            boardEl.appendChild(cell);
          }
        }
      }

      function getEmptyCells() {
        const cells = [];
        for (let row = 0; row < BOARD_SIZE; row += 1) {
          for (let col = 0; col < BOARD_SIZE; col += 1) {
            if (board[row][col] === 0) {
              cells.push({ row, col });
            }
          }
        }
        return cells;
      }

      function spawnRandomTile() {
        const empties = getEmptyCells();
        if (!empties.length) {
          return;
        }

        const { row, col } = empties[Math.floor(Math.random() * empties.length)];
        board[row][col] = Math.random() < 0.9 ? 2 : 4;
      }

      function resetGame() {
        board = createEmptyBoard();
        score = 0;
        won = false;
        gameOver = false;
        overlayEl.classList.remove('visible');
        spawnRandomTile();
        spawnRandomTile();
        updateScoreDisplay();
        renderBoard();
      }

      function mergeLine(line) {
        const values = line.filter((value) => value !== 0);
        const merged = [];
        let gained = 0;

        for (let index = 0; index < values.length; index += 1) {
          if (values[index] !== 0 && values[index] === values[index + 1]) {
            const mergedValue = values[index] * 2;
            merged.push(mergedValue);
            gained += mergedValue;
            index += 1;
          } else {
            merged.push(values[index]);
          }
        }

        while (merged.length < BOARD_SIZE) {
          merged.push(0);
        }

        return { line: merged, gained };
      }

      function moveLeft() {
        const newBoard = board.map((row) => {
          const { line, gained } = mergeLine(row);
          score += gained;
          return line;
        });

        return newBoard;
      }

      function moveRight() {
        const newBoard = board.map((row) => {
          const reversed = [...row].reverse();
          const { line, gained } = mergeLine(reversed);
          score += gained;
          return [...line].reverse();
        });

        return newBoard;
      }

      function moveUp() {
        const newBoard = Array.from({ length: BOARD_SIZE }, (_, colIndex) => {
          const column = board.map((row) => row[colIndex]);
          const { line, gained } = mergeLine(column);
          score += gained;
          return line;
        });

        return Array.from({ length: BOARD_SIZE }, (_, rowIndex) =>
          Array.from({ length: BOARD_SIZE }, (_, colIndex) => newBoard[colIndex][rowIndex])
        );
      }

      function moveDown() {
        const newBoard = Array.from({ length: BOARD_SIZE }, (_, colIndex) => {
          const column = board.map((row) => row[colIndex]).reverse();
          const { line, gained } = mergeLine(column);
          score += gained;
          return [...line].reverse();
        });

        return Array.from({ length: BOARD_SIZE }, (_, rowIndex) =>
          Array.from({ length: BOARD_SIZE }, (_, colIndex) => newBoard[colIndex][rowIndex])
        );
      }

      function serializeBoard(current) {
        return JSON.stringify(current);
      }

      function handleMove(direction) {
        if (gameOver) {
          return;
        }

        let nextBoard = board;

        switch (direction) {
          case 'left':
            nextBoard = moveLeft();
            break;
          case 'right':
            nextBoard = moveRight();
            break;
          case 'up':
            nextBoard = moveUp();
            break;
          case 'down':
            nextBoard = moveDown();
            break;
          default:
            return;
        }

        if (serializeBoard(nextBoard) === serializeBoard(board)) {
          return;
        }

        board = nextBoard;
        spawnRandomTile();

        if (!won && board.some((row) => row.some((value) => value >= 2048))) {
          won = true;
          overlayEl.classList.add('visible');
          overlayTitleEl.textContent = 'You win!';
          overlayTextEl.textContent = 'Keep going or start a new run.';
        }

        best = Math.max(best, score);
        localStorage.setItem('g2048-best', String(best));
        updateScoreDisplay();
        renderBoard();

        if (isGameOver()) {
          gameOver = true;
          overlayEl.classList.add('visible');
          overlayTitleEl.textContent = 'Game over';
          overlayTextEl.textContent = 'Press New Game to try again.';
        }
      }

      function isGameOver() {
        if (getEmptyCells().length > 0) {
          return false;
        }

        for (let row = 0; row < BOARD_SIZE; row += 1) {
          for (let col = 0; col < BOARD_SIZE; col += 1) {
            const value = board[row][col];
            if (
              (row + 1 < BOARD_SIZE && board[row + 1][col] === value) ||
              (col + 1 < BOARD_SIZE && board[row][col + 1] === value)
            ) {
              return false;
            }
          }
        }

        return true;
      }

      function handleKeyboard(event) {
        const keyMap = {
          ArrowLeft: 'left',
          ArrowRight: 'right',
          ArrowUp: 'up',
          ArrowDown: 'down',
          a: 'left',
          d: 'right',
          w: 'up',
          s: 'down'
        };

        const direction = keyMap[event.key];
        if (direction) {
          event.preventDefault();
          handleMove(direction);
        }
      }

      function handleTouchStart(event) {
        const touch = event.changedTouches[0];
        window.touchStartX = touch.clientX;
        window.touchStartY = touch.clientY;
      }

      function handleTouchEnd(event) {
        const touch = event.changedTouches[0];
        const dx = touch.clientX - (window.touchStartX || 0);
        const dy = touch.clientY - (window.touchStartY || 0);

        if (Math.abs(dx) < 24 && Math.abs(dy) < 24) {
          return;
        }

        if (Math.abs(dx) > Math.abs(dy)) {
          handleMove(dx > 0 ? 'right' : 'left');
        } else {
          handleMove(dy > 0 ? 'down' : 'up');
        }
      }

      newGameBtn.addEventListener('click', resetGame);
      overlayEl.addEventListener('click', () => {
        if (won && !gameOver) {
          overlayEl.classList.remove('visible');
        }
      });
      window.addEventListener('keydown', handleKeyboard);
      window.addEventListener('touchstart', handleTouchStart, { passive: true });
      window.addEventListener('touchend', handleTouchEnd, { passive: true });

      resetGame();
    </script>
  </body>
</html>
