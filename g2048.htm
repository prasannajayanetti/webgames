<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="page-2048">
    <div class="game" aria-label="2048 game board">
      <div class="topbar">
        <h1>2048</h1>
        <div class="scores">
          <div class="score-box">
            <div class="score-label">Score</div>
            <div id="score" class="score-value">0</div>
          </div>
          <div class="score-box">
            <div class="score-label">Best</div>
            <div id="best" class="score-value">0</div>
          </div>
        </div>
      </div>

      <div class="controls">
        <div class="instructions">Join the numbers and get to the 2048 tile!</div>
        <button id="new-game" type="button">New Game</button>
      </div>

      <div class="board-wrapper">
        <div id="board" class="board" aria-live="polite" aria-label="Game grid"></div>
        <div id="overlay" class="overlay" aria-live="assertive">
          <h2 id="overlay-title">You win!</h2>
          <p id="overlay-text">Tap to keep playing</p>
        </div>
      </div>
    </div>

    <script>
      const BOARD_SIZE = 4;
      let board = [];
      let score = 0;
      let best = Number(localStorage.getItem('g2048-best') || 0);
      let won = false;
      let gameOver = false;

      const boardEl = document.getElementById('board');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const overlayEl = document.getElementById('overlay');
      const overlayTitleEl = document.getElementById('overlay-title');
      const overlayTextEl = document.getElementById('overlay-text');
      const newGameBtn = document.getElementById('new-game');

      function createEmptyBoard() {
        return Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
      }

      function updateScoreDisplay() {
        scoreEl.textContent = String(score);
        bestEl.textContent = String(best);
      }

      function renderBoard() {
        boardEl.innerHTML = '';

        for (let row = 0; row < BOARD_SIZE; row += 1) {
          for (let col = 0; col < BOARD_SIZE; col += 1) {
            const cell = document.createElement('div');
            const value = board[row][col];
            cell.className = 'cell';
            cell.dataset.value = String(value);
            cell.textContent = value === 0 ? '' : String(value);
            boardEl.appendChild(cell);
          }
        }
      }

      function getEmptyCells() {
        const cells = [];
        for (let row = 0; row < BOARD_SIZE; row += 1) {
          for (let col = 0; col < BOARD_SIZE; col += 1) {
            if (board[row][col] === 0) {
              cells.push({ row, col });
            }
          }
        }
        return cells;
      }

      function spawnRandomTile() {
        const empties = getEmptyCells();
        if (!empties.length) {
          return;
        }

        const { row, col } = empties[Math.floor(Math.random() * empties.length)];
        board[row][col] = Math.random() < 0.9 ? 2 : 4;
      }

      function resetGame() {
        board = createEmptyBoard();
        score = 0;
        won = false;
        gameOver = false;
        overlayEl.classList.remove('visible');
        spawnRandomTile();
        spawnRandomTile();
        updateScoreDisplay();
        renderBoard();
      }

      function mergeLine(line) {
        const values = line.filter((value) => value !== 0);
        const merged = [];
        let gained = 0;

        for (let index = 0; index < values.length; index += 1) {
          if (values[index] !== 0 && values[index] === values[index + 1]) {
            const mergedValue = values[index] * 2;
            merged.push(mergedValue);
            gained += mergedValue;
            index += 1;
          } else {
            merged.push(values[index]);
          }
        }

        while (merged.length < BOARD_SIZE) {
          merged.push(0);
        }

        return { line: merged, gained };
      }

      function moveLeft() {
        const newBoard = board.map((row) => {
          const { line, gained } = mergeLine(row);
          score += gained;
          return line;
        });

        return newBoard;
      }

      function moveRight() {
        const newBoard = board.map((row) => {
          const reversed = [...row].reverse();
          const { line, gained } = mergeLine(reversed);
          score += gained;
          return [...line].reverse();
        });

        return newBoard;
      }

      function moveUp() {
        const newBoard = Array.from({ length: BOARD_SIZE }, (_, colIndex) => {
          const column = board.map((row) => row[colIndex]);
          const { line, gained } = mergeLine(column);
          score += gained;
          return line;
        });

        return Array.from({ length: BOARD_SIZE }, (_, rowIndex) =>
          Array.from({ length: BOARD_SIZE }, (_, colIndex) => newBoard[colIndex][rowIndex])
        );
      }

      function moveDown() {
        const newBoard = Array.from({ length: BOARD_SIZE }, (_, colIndex) => {
          const column = board.map((row) => row[colIndex]).reverse();
          const { line, gained } = mergeLine(column);
          score += gained;
          return [...line].reverse();
        });

        return Array.from({ length: BOARD_SIZE }, (_, rowIndex) =>
          Array.from({ length: BOARD_SIZE }, (_, colIndex) => newBoard[colIndex][rowIndex])
        );
      }

      function serializeBoard(current) {
        return JSON.stringify(current);
      }

      function handleMove(direction) {
        if (gameOver) {
          return;
        }

        let nextBoard = board;

        switch (direction) {
          case 'left':
            nextBoard = moveLeft();
            break;
          case 'right':
            nextBoard = moveRight();
            break;
          case 'up':
            nextBoard = moveUp();
            break;
          case 'down':
            nextBoard = moveDown();
            break;
          default:
            return;
        }

        if (serializeBoard(nextBoard) === serializeBoard(board)) {
          return;
        }

        board = nextBoard;
        spawnRandomTile();

        if (!won && board.some((row) => row.some((value) => value >= 2048))) {
          won = true;
          overlayEl.classList.add('visible');
          overlayTitleEl.textContent = 'You win!';
          overlayTextEl.textContent = 'Keep going or start a new run.';
        }

        best = Math.max(best, score);
        localStorage.setItem('g2048-best', String(best));
        updateScoreDisplay();
        renderBoard();

        if (isGameOver()) {
          gameOver = true;
          overlayEl.classList.add('visible');
          overlayTitleEl.textContent = 'Game over';
          overlayTextEl.textContent = 'Press New Game to try again.';
        }
      }

      function isGameOver() {
        if (getEmptyCells().length > 0) {
          return false;
        }

        for (let row = 0; row < BOARD_SIZE; row += 1) {
          for (let col = 0; col < BOARD_SIZE; col += 1) {
            const value = board[row][col];
            if (
              (row + 1 < BOARD_SIZE && board[row + 1][col] === value) ||
              (col + 1 < BOARD_SIZE && board[row][col + 1] === value)
            ) {
              return false;
            }
          }
        }

        return true;
      }

      function handleKeyboard(event) {
        const keyMap = {
          ArrowLeft: 'left',
          ArrowRight: 'right',
          ArrowUp: 'up',
          ArrowDown: 'down',
          a: 'left',
          d: 'right',
          w: 'up',
          s: 'down'
        };

        const direction = keyMap[event.key];
        if (direction) {
          event.preventDefault();
          handleMove(direction);
        }
      }

      function handleTouchStart(event) {
        const touch = event.changedTouches[0];
        window.touchStartX = touch.clientX;
        window.touchStartY = touch.clientY;
      }

      function handleTouchEnd(event) {
        const touch = event.changedTouches[0];
        const dx = touch.clientX - (window.touchStartX || 0);
        const dy = touch.clientY - (window.touchStartY || 0);

        if (Math.abs(dx) < 24 && Math.abs(dy) < 24) {
          return;
        }

        if (Math.abs(dx) > Math.abs(dy)) {
          handleMove(dx > 0 ? 'right' : 'left');
        } else {
          handleMove(dy > 0 ? 'down' : 'up');
        }
      }

      newGameBtn.addEventListener('click', resetGame);
      overlayEl.addEventListener('click', () => {
        if (won && !gameOver) {
          overlayEl.classList.remove('visible');
        }
      });
      window.addEventListener('keydown', handleKeyboard);
      window.addEventListener('touchstart', handleTouchStart, { passive: true });
      window.addEventListener('touchend', handleTouchEnd, { passive: true });

      resetGame();
    </script>
  </body>
</html>
