<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Games</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0f172a;
        color: #e5e7eb;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(100%, 520px);
        padding: clamp(24px, 6vw, 40px);
        border: 1px solid #334155;
        border-radius: 20px;
        background: #1e293b;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 8vw, 3.2rem);
      }

      p {
        margin: 10px 0 26px;
        color: #94a3b8;
        line-height: 1.5;
      }

      .games {
        display: grid;
        gap: 14px;
      }

      .game-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 20px;
        border: 1px solid #475569;
        border-radius: 14px;
        background: #273449;
        color: inherit;
        text-decoration: none;
        transition: transform 140ms ease, border-color 140ms ease, background 140ms ease;
      }

      .game-link:hover,
      .game-link:focus-visible {
        transform: translateY(-2px);
        border-color: #60a5fa;
        background: #334155;
        outline: none;
      }

      .game-name {
        font-size: 1.2rem;
        font-weight: 700;
      }

      .game-description {
        display: block;
        margin-top: 5px;
        color: #94a3b8;
        font-size: 0.9rem;
        font-weight: 400;
      }

      .arrow {
        color: #60a5fa;
        font-size: 1.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Web Games</h1>
      <p>Pick a game and start playing.</p>
      <nav class="games" aria-label="Games">
        <a class="game-link" href="g2048.htm">
          <span>
            <span class="game-name">2048</span>
            <span class="game-description">Join matching tiles to reach 2048.</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <a class="game-link" href="brick.htm">
          <span>
            <span class="game-name">Brick Drop</span>
            <span class="game-description">Move and rotate falling blocks.</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </nav>
    </main>
  </body>
</html>
